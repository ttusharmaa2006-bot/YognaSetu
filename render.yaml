# ======================================================
# YognaSetu - Render Infrastructure as Code Blueprint
# ======================================================

services:
  # Backend REST API
  - type: web
    name: yognasetu-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRATION_MS
        value: 86400000

      - key: FRONTEND_URL
        sync: false

  # Frontend React Vite Static Site
  - type: web
    name: yognasetu-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        sync: false