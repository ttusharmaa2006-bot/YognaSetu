# Server Port Config
server.port=${PORT:8080}
server.servlet.context-path=

# Spring Data MongoDB Configuration (MongoDB Atlas Cloud Cluster or containerized MongoDB)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/yognasetu_db}

# Security & JWT Configuration
yognasetu.jwt.secret=${JWT_SECRET:YognaSetuSecureSuperSecretKeyForSpringSecurityAuthenticationTokenSigning2026!}
yognasetu.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (* matches any origin or comma-separated list of origins)
yognasetu.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# API Documentation Swagger Config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true

# Logging Level
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
